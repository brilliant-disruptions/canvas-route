name: canvas_route
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cross_file: ^0.3.5+5
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_slidable: ^4.0.3
  geolocator: ^14.1.2
  go_router: ^18.1.1
  google_maps_flutter: ^2.19.0
  google_maps_flutter_platform_interface: ^2.17.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled so the app renders offline and never fetches fonts at runtime.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
